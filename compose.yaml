services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riverline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-riverline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  agent:
    build: ./services/agent
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-riverline}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-riverline}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Run npm run setup or configure .env first}
      DAILY_API_KEY: ${DAILY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      STT_MODEL: ${STT_MODEL:-scribe_v2_realtime}
      TTS_MODEL: ${TTS_MODEL:-eleven_turbo_v2_5}
      VOICE_MODEL: ${VOICE_MODEL:-openai/gpt-5.6-terra}
      VOICE_MAX_SESSIONS: ${VOICE_MAX_SESSIONS:-2}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-900}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-riverline}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-riverline}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run npm run setup or configure .env first}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Run npm run setup or configure .env first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      AGENT_API_URL: http://agent:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
