[project]
name = "riverline-agent"
version = "0.1.0"
description = "Riverline voice and financial-state service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
# Install inside Linux for the next voice milestone. No unused provider adapters yet.
voice = ["pipecat-ai[daily]>=0.0.100,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
